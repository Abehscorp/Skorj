<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

.pk-root {
  --felt: #0b3d2e;
  --felt-deep: #072a1f;
  --felt-line: rgba(212,175,55,0.18);
  --gold: #d4af37;
  --gold-soft: #e8cf7a;
  --cream: #f3ecd8;
  --maroon: #8a2038;
  --green-win: #4caf6d;
  --red-lose: #d0603f;
  --card-white: #faf6ec;
  --ink: #1c1712;
  font-family: 'Inter', sans-serif;
  color: var(--cream);
  background:
    radial-gradient(circle at 50% 0%, #124a37 0%, var(--felt) 45%, var(--felt-deep) 100%);
  min-height: 600px;
  padding: 28px 16px 40px;
  position: relative;
  overflow-x: hidden;
  border-radius: 12px;
}

.pk-root::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.05;
  background-image:
    repeating-linear-gradient(45deg, var(--gold) 0 2px, transparent 2px 40px);
}

.pk-suits {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  opacity: 0.06;
  font-size: 90px;
  color: var(--gold);
}
.pk-suits span { position: absolute; }

.pk-wrap { max-width: 460px; margin: 0 auto; position: relative; }

.pk-h1 {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 30px;
  letter-spacing: 0.5px;
  text-align: center;
  color: var(--gold-soft);
  text-shadow: 0 2px 10px rgba(0,0,0,0.4);
}
.pk-h1 small {
  display: block;
  font-family: 'Inter', sans-serif;
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(243,236,216,0.55);
  margin-top: 4px;
}

.pk-card {
  background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
  border: 1px solid var(--felt-line);
  border-radius: 16px;
  padding: 20px;
  margin-top: 22px;
  backdrop-filter: blur(2px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
}

.pk-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: var(--gold-soft);
  margin-bottom: 6px;
  display: block;
  font-weight: 600;
}

.pk-input, .pk-select {
  width: 100%;
  background: rgba(7,42,31,0.55);
  border: 1px solid rgba(212,175,55,0.35);
  color: var(--cream);
  padding: 11px 12px;
  border-radius: 9px;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  margin-bottom: 12px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.pk-input::placeholder { color: rgba(243,236,216,0.35); }
.pk-input:focus, .pk-select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212,175,55,0.18);
}
.pk-select option { background: var(--felt-deep); color: var(--cream); }

.pk-row { display: flex; gap: 8px; align-items: center; }
.pk-row .pk-input { margin-bottom: 0; }

.pk-chipnum {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--maroon) 70%);
  border: 2px dashed var(--card-white);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.4);
}

.pk-btn {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: none;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.5px;
  cursor: pointer;
  margin-top: 6px;
  transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
}
.pk-btn:active { transform: scale(0.97); }
.pk-btn-gold {
  background: linear-gradient(180deg, var(--gold-soft), var(--gold));
  color: #2a1e05;
  box-shadow: 0 6px 16px rgba(212,175,55,0.35);
}
.pk-btn-gold:hover { filter: brightness(1.06); }
.pk-btn-ghost {
  background: transparent;
  border: 1px solid rgba(212,175,55,0.4);
  color: var(--gold-soft);
}
.pk-btn-ghost:hover { background: rgba(212,175,55,0.08); }
.pk-btn-sm { width: auto; padding: 8px 14px; font-size: 12px; margin-top: 0; }
.pk-btn-icon {
  background: rgba(212,175,55,0.12);
  border: 1px solid rgba(212,175,55,0.3);
  color: var(--gold-soft);
  width: 38px; height: 38px; border-radius: 9px;
  font-size: 16px; cursor: pointer; flex-shrink: 0;
}

.pk-players { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.pk-player-field { display: flex; gap: 8px; align-items: center; }
.pk-player-field .pk-num { font-family: 'JetBrains Mono', monospace; color: rgba(243,236,216,0.4); width: 18px; font-size: 13px; }

.pk-topbar { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
.pk-menu-btn { background: none; border: none; color: var(--gold-soft); font-size: 22px; cursor: pointer; padding: 4px 8px; }

.pk-menu {
  display: none;
  flex-direction: column;
  gap: 6px;
  background: var(--felt-deep);
  border: 1px solid var(--felt-line);
  border-radius: 12px;
  padding: 10px;
  margin-top: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.35);
}
.pk-menu.open { display: flex; }
.pk-menu button {
  background: transparent; border: none; color: var(--cream);
  text-align: left; padding: 9px 10px; border-radius: 8px; font-size: 14px; cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.pk-menu button:hover { background: rgba(212,175,55,0.1); color: var(--gold-soft); }

.pk-playerrow {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 4px; border-bottom: 1px dashed rgba(212,175,55,0.15);
}
.pk-playerrow:last-child { border-bottom: none; }
.pk-pname { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 10px; }
.pk-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(160deg, #1a5c44, #0b3d2e);
  border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif; font-weight: 700; font-size: 14px; color: var(--gold-soft);
}
.pk-balance { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; }
.pk-balance.pos { color: var(--green-win); }
.pk-balance.neg { color: var(--red-lose); }
.pk-balance.zero { color: rgba(243,236,216,0.5); }

.pk-empty { text-align: center; padding: 26px 10px; color: rgba(243,236,216,0.45); font-size: 13px; }
.pk-empty .pk-suit-big { font-size: 30px; display: block; margin-bottom: 8px; opacity: 0.6; }

.pk-history-item {
  font-size: 12.5px; color: rgba(243,236,216,0.65);
  padding: 7px 0; border-bottom: 1px dashed rgba(212,175,55,0.1);
  display: flex; justify-content: space-between; gap: 8px;
}
.pk-history-item b { color: var(--gold-soft); }

.pk-modal-backdrop {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  align-items: center; justify-content: center; z-index: 50; padding: 16px;
}
.pk-modal-backdrop.open { display: flex; }
.pk-modal {
  background: linear-gradient(180deg, #0e4634, var(--felt-deep));
  border: 1px solid var(--gold);
  border-radius: 16px;
  padding: 20px;
  max-width: 380px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.pk-modal h3 {
  font-family: 'Fraunces', serif; color: var(--gold-soft); font-size: 19px; margin-bottom: 14px;
}
.pk-check-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; }
.pk-check-item {
  display: flex; align-items: center; gap: 9px; padding: 7px 8px;
  border-radius: 8px; cursor: pointer; font-size: 14px;
}
.pk-check-item:hover { background: rgba(212,175,55,0.07); }
.pk-check-item input { accent-color: var(--gold); width: 16px; height: 16px; }

.pk-export-text {
  width: 100%; min-height: 160px; background: rgba(0,0,0,0.25);
  border: 1px solid rgba(212,175,55,0.3); border-radius: 9px; color: var(--cream);
  font-family: 'JetBrains Mono', monospace; font-size: 12px; padding: 10px; margin-bottom: 10px;
  white-space: pre-wrap; line-height: 1.6;
}
.pk-copied-msg { font-size: 12px; color: var(--green-win); text-align: center; margin-top: 6px; height: 14px; }

.pk-hidden { display: none !important; }
.pk-close-x {
  float: right; background: none; border: none; color: var(--gold-soft); font-size: 18px; cursor: pointer;
}
</style>

<div class="pk-root">
  <div class="pk-suits">
    <span style="top:20px; left:-10px;">♠</span>
    <span style="bottom:10px; right:-20px;">♥</span>
    <span style="top:60%; left:80%;">♦</span>
    <span style="bottom:60%; left:10%;">♣</span>
  </div>

  <div class="pk-wrap">

    <!-- SETUP SCREEN -->
    <div id="pk-setup">
      <div class="pk-h1">Mataan<small>Pencatat Sesi Kartu</small></div>

      <div class="pk-card">
        <span class="pk-label">Nama Pemain</span>
        <div class="pk-players" id="pk-player-fields"></div>
        <button class="pk-btn pk-btn-ghost pk-btn-sm" style="margin-top:10px;" onclick="pkAddPlayerField()">+ Tambah Pemain</button>

        <div style="margin-top:16px;">
          <span class="pk-label">Nilai Taruhan per Ronde</span>
          <input class="pk-input" id="pk-bet-amount" type="number" placeholder="cth. 5000" min="0">
        </div>

        <button class="pk-btn pk-btn-gold" onclick="pkStartGame()">🂡 Mulai Sesi</button>
        <div id="pk-setup-error" style="color:var(--red-lose); font-size:12px; margin-top:8px; text-align:center;"></div>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="pk-game" class="pk-hidden">
      <div class="pk-topbar">
        <div class="pk-h1" style="font-size:22px; text-align:left;">Mataan</div>
        <button class="pk-menu-btn" onclick="pkToggleMenu()">☰</button>
      </div>
      <div class="pk-menu" id="pk-menu">
        <button onclick="pkOpenRoundModal()">➕ Tambah Meja (Ronde)</button>
        <button onclick="pkOpenExportModal()">📋 Ekspor Sesi</button>
        <button onclick="pkNewSession()">🔄 Sesi Baru</button>
      </div>

      <div class="pk-card">
        <span class="pk-label">Saldo Pemain</span>
        <div id="pk-player-list"></div>
      </div>

      <div class="pk-card">
        <span class="pk-label">Riwayat Meja</span>
        <div id="pk-history-list">
          <div class="pk-empty"><span class="pk-suit-big">♠ ♥ ♦ ♣</span>Belum ada meja dimainkan.<br>Tekan ☰ → Tambah Meja untuk mulai.</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ROUND MODAL -->
  <div class="pk-modal-backdrop" id="pk-round-modal">
    <div class="pk-modal">
      <button class="pk-close-x" onclick="pkCloseRoundModal()">✕</button>
      <h3>Tambah Meja</h3>
      <span class="pk-label">Siapa yang Menang?</span>
      <select class="pk-select" id="pk-round-winner"></select>

      <span class="pk-label">Siapa yang Ikut Main Ronde Ini?</span>
      <div class="pk-check-list" id="pk-round-participants"></div>

      <div style="margin-top:10px;">
        <span class="pk-label">Nilai Taruhan Ronde Ini</span>
        <input class="pk-input" id="pk-round-amount" type="number" min="0">
      </div>

      <button class="pk-btn pk-btn-gold" onclick="pkSubmitRound()">Simpan Meja</button>
    </div>
  </div>

  <!-- EXPORT MODAL -->
  <div class="pk-modal-backdrop" id="pk-export-modal">
    <div class="pk-modal">
      <button class="pk-close-x" onclick="pkCloseExportModal()">✕</button>
      <h3>Ekspor Sesi</h3>
      <div class="pk-export-text" id="pk-export-text"></div>
      <button class="pk-btn pk-btn-gold" onclick="pkCopyExport()">Salin</button>
      <div class="pk-copied-msg" id="pk-copied-msg"></div>
    </div>
  </div>
</div>

<script>
(function(){
  let players = [];   // {id, name, balance}
  let rounds = [];    // {winnerId, participantIds, amount}
  let defaultBet = 0;

  function pkAddPlayerField(){
    const wrap = document.getElementById('pk-player-fields');
    const idx = wrap.children.length + 1;
    const row = document.createElement('div');
    row.className = 'pk-player-field';
    row.innerHTML = `<span class="pk-num">${idx}.</span><input class="pk-input" placeholder="Nama pemain ${idx}" style="margin-bottom:0;">`;
    wrap.appendChild(row);
  }
  window.pkAddPlayerField = pkAddPlayerField;

  // seed 4 fields
  for (let i=0;i<4;i++) pkAddPlayerField();

  function pkStartGame(){
    const inputs = document.querySelectorAll('#pk-player-fields input');
    const names = Array.from(inputs).map(i => i.value.trim()).filter(v => v.length > 0);
    const bet = parseFloat(document.getElementById('pk-bet-amount').value);
    const err = document.getElementById('pk-setup-error');

    if (names.length < 2) { err.textContent = 'Minimal 2 pemain ya.'; return; }
    if (!bet || bet <= 0) { err.textContent = 'Isi dulu nilai taruhannya.'; return; }
    err.textContent = '';

    players = names.map((n, i) => ({ id: 'p'+i, name: n, balance: 0 }));
    defaultBet = bet;
    rounds = [];

    document.getElementById('pk-setup').classList.add('pk-hidden');
    document.getElementById('pk-game').classList.remove('pk-hidden');
    pkRenderPlayers();
    pkRenderHistory();
  }
  window.pkStartGame = pkStartGame;

  function pkToggleMenu(){
    document.getElementById('pk-menu').classList.toggle('open');
  }
  window.pkToggleMenu = pkToggleMenu;

  function pkInitials(name){
    return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  }

  function pkFmt(n){
    const sign = n < 0 ? '-' : (n > 0 ? '+' : '');
    return sign + Math.abs(Math.round(n)).toLocaleString('id-ID');
  }

  function pkRenderPlayers(){
    const list = document.getElementById('pk-player-list');
    list.innerHTML = '';
    players.forEach(p => {
      const cls = p.balance > 0 ? 'pos' : (p.balance < 0 ? 'neg' : 'zero');
      const row = document.createElement('div');
      row.className = 'pk-playerrow';
      row.innerHTML = `
        <div class="pk-pname"><div class="pk-avatar">${pkInitials(p.name)}</div>${p.name}</div>
        <div class="pk-balance ${cls}">${pkFmt(p.balance)}</div>`;
      list.appendChild(row);
    });
  }

  function pkRenderHistory(){
    const box = document.getElementById('pk-history-list');
    if (rounds.length === 0){
      box.innerHTML = '<div class="pk-empty"><span class="pk-suit-big">♠ ♥ ♦ ♣</span>Belum ada meja dimainkan.<br>Tekan ☰ → Tambah Meja untuk mulai.</div>';
      return;
    }
    box.innerHTML = '';
    rounds.slice().reverse().forEach((r, revIdx) => {
      const i = rounds.length - revIdx;
      const winner = players.find(p => p.id === r.winnerId);
      const others = r.participantIds.filter(id => id !== r.winnerId).length;
      const div = document.createElement('div');
      div.className = 'pk-history-item';
      div.innerHTML = `<span>Meja ${i} — <b>${winner ? winner.name : '?'}</b> menang</span><span>${pkFmt(r.amount * others)}</span>`;
      box.appendChild(div);
    });
  }

  function pkOpenRoundModal(){
    document.getElementById('pk-menu').classList.remove('open');
    const winnerSel = document.getElementById('pk-round-winner');
    winnerSel.innerHTML = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

    const partWrap = document.getElementById('pk-round-participants');
    partWrap.innerHTML = players.map(p => `
      <label class="pk-check-item">
        <input type="checkbox" value="${p.id}" checked> ${p.name}
      </label>`).join('');

    document.getElementById('pk-round-amount').value = defaultBet;
    document.getElementById('pk-round-modal').classList.add('open');
  }
  window.pkOpenRoundModal = pkOpenRoundModal;

  function pkCloseRoundModal(){
    document.getElementById('pk-round-modal').classList.remove('open');
  }
  window.pkCloseRoundModal = pkCloseRoundModal;

  function pkSubmitRound(){
    const winnerId = document.getElementById('pk-round-winner').value;
    const amount = parseFloat(document.getElementById('pk-round-amount').value);
    const checked = Array.from(document.querySelectorAll('#pk-round-participants input:checked')).map(c => c.value);

    if (!amount || amount <= 0) return;
    if (checked.length < 2 || !checked.includes(winnerId)) return;

    const losers = checked.filter(id => id !== winnerId);
    losers.forEach(id => {
      const p = players.find(pl => pl.id === id);
      p.balance -= amount;
    });
    const winnerP = players.find(pl => pl.id === winnerId);
    winnerP.balance += amount * losers.length;

    rounds.push({ winnerId, participantIds: checked, amount });

    pkRenderPlayers();
    pkRenderHistory();
    pkCloseRoundModal();
  }
  window.pkSubmitRound = pkSubmitRound;

  function pkSimplifySettlements(){
    const creditors = players.filter(p => p.balance > 0).map(p => ({ name: p.name, amt: p.balance })).sort((a,b)=>b.amt-a.amt);
    const debtors = players.filter(p => p.balance < 0).map(p => ({ name: p.name, amt: -p.balance })).sort((a,b)=>b.amt-a.amt);
    const txns = [];
    let ci = 0, di = 0;
    while (ci < creditors.length && di < debtors.length){
      const pay = Math.min(creditors[ci].amt, debtors[di].amt);
      if (pay > 0.5) txns.push({ from: debtors[di].name, to: creditors[ci].name, amt: pay });
      creditors[ci].amt -= pay;
      debtors[di].amt -= pay;
      if (creditors[ci].amt <= 0.5) ci++;
      if (debtors[di].amt <= 0.5) di++;
    }
    return txns;
  }

  function pkOpenExportModal(){
    document.getElementById('pk-menu').classList.remove('open');
    const txns = pkSimplifySettlements();
    let text = `MATAAN — Ringkasan Sesi\n`;
    text += `${new Date().toLocaleDateString('id-ID')}\n`;
    text += `${'-'.repeat(28)}\n`;
    text += `Total Meja: ${rounds.length}\n\n`;
    text += `Saldo Akhir:\n`;
    players.forEach(p => { text += `  ${p.name}: ${pkFmt(p.balance)}\n`; });
    text += `\nPenyelesaian Pembayaran:\n`;
    if (txns.length === 0){ text += `  Semua sudah impas.\n`; }
    else txns.forEach(t => { text += `  ${t.from} bayar ${t.to} sebesar ${Math.round(t.amt).toLocaleString('id-ID')}\n`; });

    document.getElementById('pk-export-text').textContent = text;
    document.getElementById('pk-copied-msg').textContent = '';
    document.getElementById('pk-export-modal').classList.add('open');
  }
  window.pkOpenExportModal = pkOpenExportModal;

  function pkCloseExportModal(){
    document.getElementById('pk-export-modal').classList.remove('open');
  }
  window.pkCloseExportModal = pkCloseExportModal;

  function pkCopyExport(){
    const text = document.getElementById('pk-export-text').textContent;
    navigator.clipboard.writeText(text).then(() => {
      document.getElementById('pk-copied-msg').textContent = 'Tersalin ke clipboard ✓';
    }).catch(() => {
      document.getElementById('pk-copied-msg').textContent = 'Gagal menyalin, salin manual ya.';
    });
  }
  window.pkCopyExport = pkCopyExport;

  function pkNewSession(){
    document.getElementById('pk-menu').classList.remove('open');
    if (!confirm('Yakin mulai sesi baru? Data sesi ini akan hilang.')) return;
    document.getElementById('pk-game').classList.add('pk-hidden');
    document.getElementById('pk-setup').classList.remove('pk-hidden');
    document.getElementById('pk-player-fields').innerHTML = '';
    for (let i=0;i<4;i++) pkAddPlayerField();
    document.getElementById('pk-bet-amount').value = '';
  }
  window.pkNewSession = pkNewSession;

})();
</script>
